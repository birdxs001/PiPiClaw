name: PiPiClaw release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (required for manual runs, for example v0.1.0 or v0.1.0-alpha.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # === Windows 阵营 ===
          - { rid: win-x64,   os: windows-latest, ext: zip,    exe: PiPiClaw.exe, use_upx: true }
          - { rid: win-x86,   os: windows-latest, ext: zip,    exe: PiPiClaw.exe, use_upx: false }
          - { rid: win-arm64, os: windows-latest, ext: zip,    exe: PiPiClaw.exe, use_upx: false }

          # === Linux glibc 阵营 ===
          - { rid: linux-x64,   os: ubuntu-latest,    ext: tar.gz, exe: PiPiClaw, use_upx: true }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, ext: tar.gz, exe: PiPiClaw, use_upx: false }
          # 32位 ARM：锁定 ubuntu-22.04
          - { rid: linux-arm,   os: ubuntu-22.04,     ext: tar.gz, exe: PiPiClaw, use_upx: false }

          # === Linux musl 阵营 (不依赖 glibc) ===
          - { rid: linux-musl-x64,   os: ubuntu-latest, ext: tar.gz, exe: PiPiClaw, use_upx: true, is_musl: true }
          - { rid: linux-musl-arm64, os: ubuntu-24.04-arm, ext: tar.gz, exe: PiPiClaw, use_upx: false, is_musl: true }

          # === macOS 阵营 ===
          - { rid: osx-x64,   os: macos-latest,   ext: tar.gz, exe: PiPiClaw, use_upx: false }
          - { rid: osx-arm64, os: macos-latest,   ext: tar.gz, exe: PiPiClaw, use_upx: false }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Dependencies (Linux glibc & Cross-Compile)
        if: startsWith(matrix.rid, 'linux') && matrix.is_musl != true
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev build-essential 7zip lld
          
          if [ "${{ matrix.rid }}" == "linux-arm" ]; then
            sudo sed -i -E 's/^deb[[:space:]]+([^\[])/deb [arch=amd64,i386] \1/g' /etc/apt/sources.list
            sudo sed -i -E 's/^deb[[:space:]]+([^\[])/deb [arch=amd64,i386] \1/g' /etc/apt/sources.list.d/*.list 2>/dev/null || true
            echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/armhf.list
            echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/armhf.list
            echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/armhf.list
            sudo dpkg --add-architecture armhf
            sudo apt-get update
            sudo apt-get install -y gcc-arm-linux-gnueabihf zlib1g-dev:armhf
          fi

      - name: Install Dependencies (Linux musl x64)
        if: matrix.rid == 'linux-musl-x64'
        run: |
          sudo apt-get update; sudo apt-get install -y musl-tools clang zlib1g-dev build-essential 7zip || true

      # ==================== 方案三：使用 Docker + Alpine 原生编译 musl 静态二进制 ====================
      - name: Build AOT (Linux musl arm64) using Docker
        if: matrix.rid == 'linux-musl-arm64'
        run: |
          # 使用官方 .NET SDK Alpine 镜像，其中自带 musl
          docker run --rm \
            -v ${{ github.workspace }}:/src \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine \
            sh -c "
              apk add --no-cache clang build-base zlib-dev && \
              dotnet publish -c Release \
                -r linux-musl-arm64 \
                -p:PublishAot=true \
                -p:StripSymbols=true \
                -p:DebugType=none \
                -p:StaticallyLinked=true \
                -p:IlcLinkStatic=true \
                -o /src/publish_dir
            "
          # 确保输出目录存在
          mkdir -p publish_dir
          # 将容器内生成的产物复制出来（挂载卷已经直接写入，但可能需要移动）
          if [ -d publish_dir ]; then
            echo "Output already in publish_dir"
          else
            echo "Error: No output generated"
            exit 1
          fi

      - name: Build AOT (Windows & macOS)
        if: startsWith(matrix.rid, 'win') || startsWith(matrix.rid, 'osx')
        shell: bash
        run: |
          dotnet publish -c Release \
            -r ${{ matrix.rid }} \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -p:DebugType=none \
            -o ./publish_dir

      - name: Build AOT (Linux glibc)
        if: startsWith(matrix.rid, 'linux') && matrix.is_musl != true
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "${{ matrix.rid }}" == "linux-arm" ]; then
            EXTRA_ARGS="-p:ObjCopyName=arm-linux-gnueabihf-objcopy -p:LinkerFlavor=lld"
          fi
          dotnet publish -c Release \
            -r ${{ matrix.rid }} \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -p:DebugType=none \
            $EXTRA_ARGS \
            -o ./publish_dir

      - name: Build AOT (Linux musl x64)
        if: matrix.rid == 'linux-musl-x64'
        shell: bash
        run: |
          export CC="musl-gcc"
          dotnet publish -c Release \
            -r ${{ matrix.rid }} \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -p:DebugType=none \
            -p:StaticallyLinked=true \
            -o ./publish_dir

      # 注意：linux-musl-arm64 的构建步骤已由上面的 Docker 步骤完成，这里不再重复

      - name: UPX Compression
        if: matrix.use_upx == true
        uses: svenstaro/upx-action@v2
        with:
          files: ./publish_dir/${{ matrix.exe }}
          args: --best --lzma
          strip: true

      - name: Cleanup and Packaging
        shell: bash
        run: |
          cd ./publish_dir
          rm -rf *.pdb *.dbg *.dsym
          if [[ "${{ matrix.os }}" != "windows-latest" ]]; then
            chmod +x ${{ matrix.exe }}
          fi
          if [ "${{ matrix.ext }}" == "zip" ]; then
            7z a -tzip -mx=9 ../PiPiClaw_${{ matrix.rid }}.zip *
          else
            tar cf - * | 7z a -si -tgzip -mx=9 ../PiPiClaw_${{ matrix.rid }}.tar.gz
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "PiPiClaw Latest Build"
          files: PiPiClaw_${{ matrix.rid }}.${{ matrix.ext }}
          make_latest: true
          prerelease: false
          append_body: true
          overwrite: true
