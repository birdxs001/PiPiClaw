name: PiPiClaw release

on:
  workflow_dispatch:
  push:
    branches: ["master"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # === Windows 阵营 ===
          - { rid: win-x64,   os: windows-latest, ext: zip,    exe: PiPiClaw.exe, use_upx: true }
          - { rid: win-x86,   os: windows-latest, ext: zip,    exe: PiPiClaw.exe, use_upx: false }
          - { rid: win-arm64, os: windows-latest, ext: zip,    exe: PiPiClaw.exe, use_upx: false }

          # === Linux 阵营 ===
          # x64: 使用 Debian 11 容器确保 glibc 2.31 兼容性
          - { rid: linux-x64,   os: ubuntu-latest, ext: tar.gz, exe: PiPiClaw, use_upx: true, use_container: true, container_image: "debian:bullseye" }
          # arm64: 使用 Debian 11 + QEMU 模拟
          - { rid: linux-arm64, os: ubuntu-latest, ext: tar.gz, exe: PiPiClaw, use_upx: false, use_qemu: true, container_image: "debian:bullseye" }
          # 32位 ARM：使用 ubuntu-22.04 原生 ARM runner
          - { rid: linux-arm,   os: ubuntu-22.04-arm, ext: tar.gz, exe: PiPiClaw, use_upx: false }

          # === macOS 阵营 ===
          - { rid: osx-x64,   os: macos-latest,   ext: tar.gz, exe: PiPiClaw, use_upx: false }
          - { rid: osx-arm64, os: macos-latest,   ext: tar.gz, exe: PiPiClaw, use_upx: false }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 为 ARM64 设置 QEMU 模拟
      - name: Setup QEMU
        if: matrix.use_qemu == true
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # 使用容器运行步骤（Debian 11）
      - name: Build in Debian 11 Container
        if: matrix.use_container == true || matrix.use_qemu == true
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.container_image }}
          options: --platform linux/${{ matrix.rid == 'linux-arm64' && 'arm64' || 'amd64' }} -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            # 在容器内执行构建
            apt-get update
            apt-get install -y curl ca-certificates clang zlib1g-dev build-essential 7zip lld
            
            # 安装 .NET
            curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0 --install-dir ~/.dotnet
            export PATH="$HOME/.dotnet:$PATH"
            
            # 构建
            dotnet publish -c Release \
              -r ${{ matrix.rid }} \
              -p:PublishAot=true \
              -p:StripSymbols=true \
              -p:DebugType=none \
              -o ./publish_dir

      # 原生宿主机构建（非容器化）
      - name: Setup .NET (Native)
        if: matrix.use_container != true && matrix.use_qemu != true
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Dependencies (Native Linux)
        if: startsWith(matrix.rid, 'linux') && matrix.use_container != true && matrix.use_qemu != true
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev build-essential 7zip lld
          
          if [ "${{ matrix.rid }}" == "linux-arm" ]; then
            # 配置 32位 ARM 交叉编译
            sudo sed -i -E 's/^deb[[:space:]]+([^\[])/deb [arch=amd64,i386] \1/g' /etc/apt/sources.list
            sudo sed -i -E 's/^deb[[:space:]]+([^\[])/deb [arch=amd64,i386] \1/g' /etc/apt/sources.list.d/*.list 2>/dev/null || true
            
            echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/armhf.list
            echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/armhf.list
            echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/armhf.list
            
            sudo dpkg --add-architecture armhf
            sudo apt-get update
            sudo apt-get install -y gcc-arm-linux-gnueabihf zlib1g-dev:armhf
          fi

      - name: Build AOT (Native)
        if: matrix.use_container != true && matrix.use_qemu != true
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "${{ matrix.rid }}" == "linux-arm" ]; then
            EXTRA_ARGS="-p:ObjCopyName=arm-linux-gnueabihf-objcopy -p:LinkerFlavor=lld"
          fi
          
          dotnet publish -c Release \
            -r ${{ matrix.rid }} \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -p:DebugType=none \
            $EXTRA_ARGS \
            -o ./publish_dir

      # UPX 压缩（容器构建后的文件在宿主机上）
      - name: UPX Compression (Container builds)
        if: (matrix.use_container == true || matrix.use_qemu == true) && matrix.use_upx == true
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y upx-ucl
          upx --best --lzma ./publish_dir/${{ matrix.exe }}

      - name: UPX Compression (Native builds)
        if: matrix.use_upx == true && matrix.use_container != true && matrix.use_qemu != true
        uses: svenstaro/upx-action@v2
        with:
          files: ./publish_dir/${{ matrix.exe }}
          args: --best --lzma
          strip: true

      - name: Cleanup and Packaging
        shell: bash
        run: |
          cd ./publish_dir
          
          rm -rf *.pdb *.dbg *.dsym
          
          if [[ "${{ matrix.os }}" != "windows-latest" ]]; then
            chmod +x ${{ matrix.exe }}
          fi

          if [ "${{ matrix.ext }}" == "zip" ]; then
            7z a -tzip -mx=9 ../PiPiClaw_${{ matrix.rid }}.zip *
          else
            tar cf - * | 7z a -si -tgzip -mx=9 ../PiPiClaw_${{ matrix.rid }}.tar.gz
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "PiPiClaw Latest Build"
          files: PiPiClaw_${{ matrix.rid }}.${{ matrix.ext }}
          make_latest: true
          prerelease: false
          append_body: true
          overwrite: true

